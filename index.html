<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Hauling</title>
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#1f2937;--mute:#64748b;--line:#e2e8f0;--gold:#F2B705;--gold-d:#B58900;--gold-l:#FFF4CC;--red:#dc2626;--ok:#047857;--inp:#fff;--side:#1f2937;--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04)}
.dark{--bg:#0b1220;--card:#162033;--ink:#e5e7eb;--mute:#94a3b8;--line:#2b3a52;--gold-l:#3a3110;--inp:#0f172a;--side:#0f172a;--shadow:0 1px 3px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.h1{font-size:22px;margin:0 0 6px;font-weight:700}.h2{font-size:16px;margin:0 0 8px;font-weight:600}.h3{font-size:14px;margin:10px 0 6px;font-weight:600}
.mut{color:var(--mute)}.kecil{font-size:12.5px}.tebal{font-weight:600}.ok{color:var(--ok)}.neg{color:var(--red)}.rata-kanan{text-align:right;margin-top:14px}.wajib{color:var(--red)}
/* kerangka */
#app{display:flex;min-height:100vh}
#side{display:none;width:262px;flex:none;background:var(--side);color:#e5e7eb;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:3px solid var(--gold)}
.brand small{display:block;color:#94a3b8;font-size:12px}
.logo-kotak{width:38px;height:38px;border-radius:10px;background:var(--gold);color:#1f2937;display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:10px}
.brand .logo-kotak{margin:0}
#nav,#navMobile{padding:8px}
.grup-judul{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-align:left}
.grup-judul:hover{background:rgba(255,255,255,.07)}.grup-judul .panah{margin-left:auto;opacity:.6}.ikon{width:20px;text-align:center;color:var(--gold)}
.grup-isi{padding:2px 0 6px 30px}.tautan{display:block;padding:6px 10px;border-radius:7px;color:#cbd5e1;text-decoration:none;font-size:13.5px}
.tautan:hover{background:rgba(255,255,255,.07)}.tautan.aktif{background:var(--gold);color:#1f2937;font-weight:600}
.side-foot{margin-top:auto;padding:12px;display:flex;gap:8px}
.isi{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:var(--shadow)}
.topbar h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ikon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}
#main{padding:16px 14px 96px;max-width:1280px;margin:0 auto}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:11px;color:var(--mute);text-decoration:none;background:none;border:0;cursor:pointer}
.bn span{font-size:19px;line-height:1}.bn.aktif{color:var(--gold-d);font-weight:700}
#drawer{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5)}#drawer.buka{display:block}
.drawer-panel{width:84%;max-width:320px;height:100%;background:var(--side);color:#e5e7eb;overflow-y:auto}
.drawer-kepala{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--gold)}
.drawer-kepala .ikon-btn{background:none;color:#fff;border-color:#475569}
@media(min-width:1024px){#side{display:flex}#bottom,#hamburger,#drawer{display:none!important}#main{padding:22px 26px 40px}}
/* komponen */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card-kepala{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.form-card{max-width:880px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.grid-2>.card{margin-bottom:0}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.f{min-width:0}.f-penuh{grid-column:1/-1}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:0 0 3px}.lbl-kecil{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
.inp{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--inp);color:var(--ink)}
.inp:focus{border-color:var(--gold)}textarea.inp{resize:vertical}
.f small{display:block;margin-top:3px;font-size:12px}
.cek{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}.cek input{margin-top:3px}
.btn{border:0;background:var(--ink);color:var(--gold);font-weight:600;font-size:14px;border-radius:9px;padding:10px 18px;cursor:pointer;transition:filter .15s}
.dark .btn{background:var(--gold);color:#1f2937}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.5;cursor:wait}
.btn-alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.dark .btn-alt{background:var(--card);color:var(--ink)}
.btn-kecil{padding:6px 11px;font-size:12.5px}.btn-besar{padding:14px 26px;font-size:16px}
.btn-bahaya{background:var(--red);color:#fff}.dark .btn-bahaya{background:var(--red);color:#fff}.btn-ok{background:var(--ok);color:#fff}.dark .btn-ok{background:var(--ok);color:#fff}
.aksi{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.aksi.kolom{flex-direction:column}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.msg-ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}.msg-er{background:#fef2f2;color:#991b1b;border-color:#fecaca}.msg-wn{background:var(--gold-l);color:#7a5a00;border-color:#f6d55c}
.dark .msg-ok{background:#052e22;color:#6ee7b7}.dark .msg-er{background:#3b0d0d;color:#fca5a5}.dark .msg-wn{color:#fcd34d}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:0;text-decoration:none}
.chip-ok{background:#d1fae5;color:#065f46}.chip-er{background:#fee2e2;color:#991b1b}.chip-wn{background:var(--gold-l);color:#7a5a00;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lv{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}.lv-merah{background:#fee2e2;color:#991b1b}.lv-oranye{background:#ffedd5;color:#9a3412}.lv-kuning{background:#fef3c7;color:#92400e}
.banner{border-left:5px solid var(--gold)}.banner-merah{border-left-color:var(--red)}
.baris-sp{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:5px solid var(--gold);padding:12px 14px}
.k small{display:block;color:var(--mute);font-size:12px}.k b{font-size:21px}.k-merah{border-left-color:var(--red)}.k-merah b{color:var(--red)}
.angka-besar{font-size:24px;font-weight:700;margin:6px 0 10px}
.progres-daftar{display:grid;gap:12px}.bar-bg{background:var(--line);border-radius:999px;height:8px;overflow:hidden;margin-top:3px}.bar-bg i{display:block;height:8px;border-radius:999px}
.tabel-wrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);font-weight:600;text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl .n{text-align:right;white-space:nowrap}.tbl td.sub{padding-left:22px}
.g-h td{background:var(--gold-l);font-weight:700}.g-t td{font-weight:700;border-top:2px solid var(--ink)}.aksi-sel{white-space:nowrap}
.grafik{width:100%;height:auto}.gr-garis{stroke:var(--line);stroke-width:1}.gr-teks{fill:var(--mute);font-size:10px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.sk{height:90px;border-radius:12px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%}
@media(prefers-reduced-motion:no-preference){.sk{animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}}
.filter{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}.preset{display:flex;gap:6px;flex-wrap:wrap}
.bar-ekspor{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.toasts,#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:200;display:grid;gap:8px;width:min(92vw,460px)}
.toast{padding:11px 14px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast-ok{background:#047857;color:#fff}.toast-er{background:#b91c1c;color:#fff}.toast-wn{background:#b58900;color:#fff}
.modal-wrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px}.modal-box.lebar{max-width:860px}
@media(min-width:700px){.modal-wrap{align-items:center;padding:20px}.modal-box{border-radius:18px}}
.keep{display:flex;gap:10px;align-items:flex-start;background:var(--gold-l);border:1px solid #f6d55c;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:14px;cursor:pointer}
.foto-aksi{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.foto-pra{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto-item{position:relative;display:inline-block}.foto-item img{height:74px;border-radius:9px;border:1px solid var(--line)}
.foto-item button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;line-height:1}
.blok{border:1px dashed var(--line);border-radius:12px;padding:12px;margin:14px 0}
.dinamis-baris{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}.dinamis-baris .btn{margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.seg-btn{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer}.seg-btn small{display:block;color:var(--mute);margin-top:3px;font-size:12px}.seg-btn.on{border-color:var(--gold);background:var(--gold-l)}
[data-k="tipe"]{display:none}
.grid-faktur{display:grid;gap:14px}@media(min-width:1000px){.grid-faktur{grid-template-columns:2fr 1fr;align-items:start}.sticky-kanan{position:sticky;top:80px}}
.netto{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-top:10px}.netto small{display:block;color:#cbd5e1}.netto b{font-size:22px;color:var(--gold)}.dark .netto{background:#0b1220}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab-bar .on{background:var(--gold);color:#1f2937;border-color:var(--gold)}
.absen-box{display:grid;gap:12px}.absen-status{font-size:18px;font-weight:700}
.accordion details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}.accordion summary{padding:11px 14px;cursor:pointer;font-weight:600}.accordion ol{margin:0;padding:0 14px 12px 34px;font-size:14px}
.cek-daftar{display:grid;gap:8px}.cek-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none}.cek-item.ok{border-color:#a7f3d0;background:#ecfdf5}.dark .cek-item.ok{background:#052e22}.cek-ikon{font-size:18px;color:var(--mute)}.cek-item.ok .cek-ikon{color:var(--ok)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:26px;width:min(100%,420px);border:1px solid var(--line)}
.slip .kop-slip{border-bottom:3px solid var(--gold);margin-bottom:8px}.slip table{width:100%;border-collapse:collapse}.slip td,.slip th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}.slip .n{text-align:right}.slip .t td{font-weight:700}
@media print{#side,.topbar,#bottom,.bar-ekspor,.filter,.btn{display:none!important}#main{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div id="login" hidden></div>
<div id="app" hidden>
  <aside id="side">
    <div class="brand"><div class="logo-kotak">H</div><div><b>Sistem Hauling</b><small id="penggunaNama"></small></div></div>
    <nav id="nav" aria-label="Menu utama"></nav>
    <div class="side-foot"><button id="temaBtn" class="btn btn-alt btn-kecil" type="button">Tema</button><button id="keluarBtn" class="btn btn-alt btn-kecil" type="button">Keluar</button></div>
  </aside>
  <div class="isi">
    <header class="topbar"><button id="hamburger" class="ikon-btn" type="button" aria-label="Buka menu">☰</button><h1 id="judul"></h1><div id="status" class="status"></div></header>
    <main id="main"></main>
  </div>
</div>
<nav id="bottom" aria-label="Menu cepat"></nav>
<div id="drawer"><div class="drawer-panel"><div class="drawer-kepala"><b>Menu</b><button id="drawerTutup" class="ikon-btn" type="button" aria-label="Tutup menu">✕</button></div><div id="navMobile"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="modals"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   SISTEM HAULING V6  |  Supabase + Vercel  |  satu berkas index.html
   Isi: konfigurasi, util, ekspor (CSV/Excel/PDF), antrean offline, router, halaman.
   ===================================================================== */
const SUPABASE_URL = 'ISI_URL_PROYEK_SUPABASE_ANDA';        // contoh: https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = 'ISI_ANON_KEY_SUPABASE_ANDA';      // Project Settings > API > anon public

/*PURE-START*/
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const hariIni = () => ymd(new Date());
const nf = (n, d) => (n === null || n === undefined || n === '' || isNaN(Number(n))) ? '' : Number(n).toLocaleString('id-ID', { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 2 : d });
const rp = n => (n === null || n === undefined || n === '' || isNaN(Number(n))) ? '-' : (Number(n) < 0 ? '-Rp ' : 'Rp ') + Math.abs(Number(n)).toLocaleString('id-ID', { maximumFractionDigits: 0 });
const tglId = s => { s = String(s || ''); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : s; };
const uuid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const angka = v => { if (v === null || v === undefined) return null; let s = String(v).trim(); if (s === '') return null; if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); const n = Number(s); return isNaN(n) ? null : n; };
const round2 = x => Math.round(x * 100) / 100;

/* ---------- ekspor: model tabel -> CSV / XLSX (OOXML dirakit di browser) ---------- */
// model: { judul, sub:[teks], kolom:[{k,l,t}], baris:[{k:nilai,_g:'h'|'t'}] }  t: 't' teks, 'n' angka, 'd' tanggal
function nilaiSel(c, v) { return c.t === 'd' ? tglId(v) : v; }
function csvSel(v) { const s = v === undefined || v === null ? '' : String(v); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvIsi(m) {
  const out = (m.sub || []).map(csvSel);
  out.push('');
  out.push(m.kolom.map(c => csvSel(c.l)).join(','));
  m.baris.forEach(r => out.push(m.kolom.map(c => csvSel(c.t === 'n' && r[c.k] !== undefined && r[c.k] !== null && r[c.k] !== '' ? Number(r[c.k]) : nilaiSel(c, r[c.k]))).join(',')));
  return '\uFEFF' + out.join('\r\n');
}
const xmlEsc = s => String(s === undefined || s === null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function kolHuruf(i) { let s = ''; for (i = i + 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s; return s; }
let _crcT = null;
function crc32(b) {
  if (!_crcT) { _crcT = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; _crcT[n] = c >>> 0; } }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = _crcT[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const enc = s => new TextEncoder().encode(s);
// ZIP tanpa kompresi (metode "store"), cukup untuk paket OOXML
function zipStore(files) {
  const parts = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  files.forEach(f => {
    const name = enc(f.name), data = typeof f.data === 'string' ? enc(f.data) : f.data, crc = crc32(data);
    const head = new Uint8Array([0x50, 0x4B, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    parts.push(head, name, data);
    central.push(new Uint8Array([0x50, 0x4B, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += head.length + name.length + data.length;
  });
  const cdSize = central.reduce((s, x) => s + x.length, 0);
  const end = new Uint8Array([0x50, 0x4B, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  const all = parts.concat(central, [end]), out = new Uint8Array(all.reduce((s, x) => s + x.length, 0));
  let p = 0;
  all.forEach(x => { out.set(x, p); p += x.length; });
  return out;
}

/* ---------- pembantu perhitungan tampilan (murni) ---------- */
function hitungFaktur(dpp, ppnPersen, pphPersen, kontra) {
  const ppn = round2(dpp * (ppnPersen || 0) / 100), pph = round2(dpp * (pphPersen || 0) / 100), kotor = round2(dpp + ppn - pph), kb = round2(kontra || 0);
  return { dpp: round2(dpp), ppn: ppn, pph: pph, kotor: kotor, kontra: kb, netto: round2(kotor - kb) };
}
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, r = x => x * Math.PI / 180, a = Math.sin(r(lat2 - lat1) / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lng2 - lng1) / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)) * 10) / 10;
}
function ramahGalat(msg) {
  msg = String(msg || 'Terjadi kesalahan.');
  if (/ux_produksi_spb/.test(msg)) return 'No. SPB ini sudah pernah dicatat.';
  if (/row-level security|permission denied/i.test(msg)) return 'Akses ditolak untuk peran Anda.';
  if (/violates foreign key/i.test(msg)) return 'Data ini masih dipakai di transaksi lain, jadi tidak bisa dihapus.';
  if (/duplicate key/i.test(msg)) return 'Data dengan kode/nomor yang sama sudah ada.';
  if (/JWT expired|invalid JWT/i.test(msg)) return 'Sesi berakhir. Silakan masuk lagi.';
  if (/violates check constraint/i.test(msg)) return 'Ada isian yang nilainya tidak valid. Periksa kembali.';
  if (/null value in column "?([a-z_]+)"?/i.test(msg)) return 'Isian wajib belum lengkap: ' + msg.match(/null value in column "?([a-z_]+)"?/i)[1].replace(/_/g, ' ') + '.';
  return msg;
}

function galat(e) {

/* ---------- foto opsional: kamera, kompres, antre ---------- */
const FOTO = {};
async function kompres(file, maks, mutu) {
  maks = maks || 1280; mutu = mutu || 0.72;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak bisa dibaca.')); i.src = url; });
    const k = Math.min(1, maks / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', mutu));
  } finally { URL.revokeObjectURL(url); }
}
function fotoHtml(id, label) {
  FOTO[id] = [];
  return '<div class="f f-penuh" data-foto="' + id + '"><label class="lbl">' + esc(label || 'Foto (opsional)') + '</label><div class="foto-aksi"><label class="btn btn-alt btn-kecil">Ambil / pilih foto<input type="file" accept="image/*" capture="environment" multiple hidden></label><span class="mut kecil">Boleh dilewati. Foto dikompres otomatis.</span></div><div class="foto-pra"></div></div>';
}
function fotoPasang(host) {
  $$('[data-foto]', host).forEach(box => {
    const id = box.dataset.foto, inp = $('input[type=file]', box), pra = $('.foto-pra', box);
    inp.onchange = async () => {

      }
      inp.value = '';
      pra.innerHTML = FOTO[id].map((b, i) => '<span class="foto-item"><img src="' + URL.createObjectURL(b) + '" alt="foto"><button type="button" data-hapus="' + i + '" aria-label="Hapus foto">x</button></span>').join('');
      $$('[data-hapus]', pra).forEach(bt => bt.onclick = () => { FOTO[id].splice(Number(bt.dataset.hapus), 1); inp.onchange({}); });
    };

}

/* ---------- antrean offline (IndexedDB) ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('hauling_v6', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('antrian', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbOp(mode, fn) {
  const d = await idb();
  return new Promise((res, rej) => {
    const t = d.transaction('antrian', mode), req = fn(t.objectStore('antrian'));
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const antrianSemua = () => idbOp('readonly', s => s.getAll());
const antrianSimpan = it => idbOp('readwrite', s => s.put(it));
const antrianHapus = id => idbOp('readwrite', s => s.delete(id));

async function unggahFoto(fotos, tabel, baris_id, klien_id) {
  if (!fotos || !fotos.length) return;
  for (let i = 0; i < fotos.length; i++) {
    const path = S.user.id + '/' + tabel + '/' + klien_id + '_' + i + '.jpg';
    const up = await sb.storage.from('lampiran').upload(path, fotos[i], { contentType: 'image/jpeg', upsert: true });
    if (up.error) throw galat(up.error);
    const ins = await sb.from('lampiran').insert({ tabel: tabel, baris_id: baris_id, klien_id: klien_id, jenis: 'foto', path: path, ukuran: fotos[i].size });
    if (ins.error) throw galat(ins.error);
  }
}
// mengirim data lapangan; bila tidak ada sinyal, disimpan di perangkat lalu dikirim otomatis nanti
async function kirimLapangan(nama, payload, fotos, tabelFoto) {
  payload.klien_id = payload.klien_id || uuid();
  try {
    const r = await rpcP(nama, payload);
    try { await unggahFoto(fotos, tabelFoto, (r && (r.id || r.perbaikan_id)) || null, payload.klien_id); }
    catch (e) { await antrianSimpan({ id: uuid(), jenis: 'foto', fotos: fotos, tabelFoto: tabelFoto, baris_id: (r && (r.id || r.perbaikan_id)) || null, klien_id: payload.klien_id, dibuat: Date.now(), status: 'menunggu' }); toast('Data tersimpan; foto menunggu koneksi.', 2); }
    return { hasil: r, antri: false };
  } catch (e) {
    if (e.jaringan || !navigator.onLine) {
      await antrianSimpan({ id: uuid(), jenis: 'rpc', rpc: nama, payload: payload, fotos: fotos || [], tabelFoto: tabelFoto, dibuat: Date.now(), status: 'menunggu' });
      indikator();
      return { antri: true };
    }
    throw e;
  }
}
let sedangSinkron = false;
async function sinkronAntrian() {
  if (sedangSinkron || !navigator.onLine || !sb || !S.user) return;
  sedangSinkron = true;
  try {
    const daftar = (await antrianSemua()).filter(x => x.status === 'menunggu').sort((a, b) => a.dibuat - b.dibuat);
    for (const it of daftar) {
      try {
        if (it.jenis === 'foto') await unggahFoto(it.fotos, it.tabelFoto, it.baris_id, it.klien_id);
        else { const r = await rpcP(it.rpc, it.payload); await unggahFoto(it.fotos, it.tabelFoto, (r && (r.id || r.perbaikan_id)) || null, it.payload.klien_id); }
        await antrianHapus(it.id);
      } catch (e) {
        if (e.jaringan) break;
        it.status = 'gagal'; it.galat = e.message;
        await antrianSimpan({ id: it.id, jenis: it.jenis, rpc: it.rpc, payload: it.payload, fotos: [], tabelFoto: it.tabelFoto, dibuat: it.dibuat, status: 'gagal', galat: e.message });
        try { await rpc('lapor_gagal_sinkron', { p_rpc: it.rpc || 'foto', p_payload: it.payload || {}, p_galat: e.message }); } catch (_) { /* dicatat lokal saja */ }
      }
    }
  } finally { sedangSinkron = false; indikator(); }
}
async function indikator() {
  const el = $('#status');
  if (!el) return;
  let n = 0, g = 0;
  try { const a = await antrianSemua(); n = a.filter(x => x.status === 'menunggu').length; g = a.filter(x => x.status === 'gagal').length; } catch (e) { /* IDB tidak tersedia */ }
  el.innerHTML = (navigator.onLine ? '<span class="chip chip-ok">Online</span>' : '<span class="chip chip-er">Offline</span>') +
    (n ? ' <button class="chip chip-wn" data-antri>' + n + ' menunggu sinkron</button>' : '') + (g ? ' <button class="chip chip-er" data-antri>' + g + ' gagal</button>' : '');
  $$('[data-antri]', el).forEach(b => b.onclick = tampilAntrian);
}
async function tampilAntrian() {
  const a = (await antrianSemua()).sort((x, y) => x.dibuat - y.dibuat);
  const m = modal('<h3 class="h3">Antrean data di perangkat</h3>' + (a.length ? '<div class="tabel-wrap"><table class="tbl"><tr><th>Waktu</th><th>Jenis</th><th>Status</th><th>Catatan</th><th></th></tr>' +
    a.map(x => '<tr><td>' + new Date(x.dibuat).toLocaleString('id-ID') + '</td><td>' + esc(x.rpc || 'foto') + '</td><td>' + esc(x.status) + '</td><td>' + esc(x.galat || '') + '</td><td><button class="btn btn-kecil btn-alt" data-ulang="' + x.id + '">Coba lagi</button> <button class="btn btn-kecil btn-bahaya" data-hapus="' + x.id + '">Hapus</button></td></tr>').join('') + '</table></div>' : '<p class="mut">Antrean kosong.</p>') +
    '<div class="rata-kanan"><button class="btn btn-alt" data-tutup>Tutup</button></div>', { lebar: 'lebar' });
  $$('[data-hapus]', m).forEach(b => b.onclick = async () => { if (await konfirmasi('Hapus data ini dari perangkat? Data ini belum tersimpan di server.', { bahaya: true, ya: 'Hapus' })) { await antrianHapus(b.dataset.hapus); m.remove(); indikator(); } });
  $$('[data-ulang]', m).forEach(b => b.onclick = async () => { const it = a.find(x => x.id === b.dataset.ulang); it.status = 'menunggu'; await antrianSimpan(it); m.remove(); sinkronAntrian(); });

function unduh(data, nama, mime) {

function muatSkrip(src) {

async function pdfUnduh(m) {

/* ---------- komponen tampilan: kartu, KPI, grafik, peringatan ---------- */
const card = (judul, isi, aksi) => '<div class="card"><div class="card-kepala"><h2 class="h2">' + esc(judul) + '</h2>' + (aksi || '') + '</div>' + isi + '</div>';
const kpiHtml = (arr) => '<div class="kpi">' + arr.map(k => '<div class="k' + (k[2] ? ' k-merah' : '') + '"><small>' + esc(k[0]) + '</small><b>' + esc(k[1]) + '</b></div>').join('') + '</div>';
const rpS = n => { const a = Math.abs(Number(n) || 0), s = Number(n) < 0 ? '-' : ''; return a >= 1e9 ? s + 'Rp ' + nf(a / 1e9, 2) + ' M' : a >= 1e6 ? s + 'Rp ' + nf(a / 1e6, 1) + ' jt' : rp(n); };
function grafikBatang(label, seri) {
  if (!label.length) return '<p class="mut">Tidak ada data.</p>';
  const W = 640, H = 230, pl = 52, pb = 28, pt = 12, semua = seri.flatMap(s => s.v.map(Number));
  const mx = Math.max(0, ...semua), mn = Math.min(0, ...semua), rg = (mx - mn) || 1, y = v => pt + (H - pt - pb) * (1 - (v - mn) / rg), gw = (W - pl - 8) / label.length, bw = Math.max(4, Math.min(30, gw / (seri.length + 1)));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = mn + rg * i / 4; g += '<line x1="' + pl + '" x2="' + (W - 8) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gr-garis"/><text x="' + (pl - 6) + '" y="' + (y(v) + 3) + '" class="gr-teks" text-anchor="end">' + esc(rpS(v).replace('Rp ', '')) + '</text>'; }
  label.forEach((l, i) => {
    const x0 = pl + gw * i + gw / 2 - bw * seri.length / 2;
    seri.forEach((s, j) => { const v = Number(s.v[i]) || 0, y0 = y(0), yv = y(v); g += '<rect x="' + (x0 + bw * j) + '" y="' + Math.min(y0, yv) + '" width="' + (bw - 2) + '" height="' + Math.max(1, Math.abs(y0 - yv)) + '" fill="' + s.c + '" rx="2"><title>' + esc(s.n + ' ' + l + ': ' + rp(v)) + '</title></rect>'; });
    g += '<text x="' + (pl + gw * i + gw / 2) + '" y="' + (H - 8) + '" class="gr-teks" text-anchor="middle">' + esc(String(l).slice(-5)) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="grafik" role="img">' + g + '</svg><div class="legenda">' + seri.map(s => '<span><i style="background:' + s.c + '"></i>' + esc(s.n) + '</span>').join('') + '</div>';
}
function barProgres(daftar, fmt) {
  const tot = daftar.reduce((s, x) => s + (Number(x.jumlah) || 0), 0), warna = ['#F2B705', '#1f2937', '#B58900', '#2E7D32', '#C0392B', '#64748b', '#0ea5e9', '#a855f7'];
  return '<div class="progres-daftar">' + daftar.map((x, i) => { const p = tot ? (Number(x.jumlah) || 0) / tot * 100 : 0; return '<div><div class="baris-sp"><span>' + esc(x.nama) + '</span><b>' + (x.jumlah === null || x.jumlah === undefined ? 'disembunyikan' : (fmt ? fmt(x.jumlah) : rp(x.jumlah))) + ' <small class="mut">' + nf(p, 1) + '%</small></b></div><div class="bar-bg"><i style="width:' + Math.min(100, p) + '%;background:' + warna[i % warna.length] + '"></i></div></div>'; }).join('') + '</div>';
}

function ringkasFaktur(host, hit, tampil) {

async function formKontra(host, tag) {
  const opsiTag = [['', '(belum ada tagihan: dicatat otomatis)']].concat(tag.map(t => [t.id, t.nomor + ' · ' + t.pemasok + ' · sisa ' + nf(t.sisa)]));
  const kb = barisDinamis(host, [{ k: 'pemasok_id', l: 'Pemasok', t: 'sel', o: pilihan('pemasok') }, { k: 'tagihan_id', l: 'Tagihan yang dipotong', t: 'sel', o: opsiTag },
    { k: 'nominal', l: 'Nominal pemotongan (Rp)', t: 'num' }, { k: 'keterangan', l: 'Keterangan Pemotongan Kontra Bon', t: 'text', ph: 'mis. Pemotongan Solar Periode I Nov' }], { min: 0, tambahTeks: '+ Tambah pemotongan' });
  host.addEventListener('change', e => {
    if (!/^f_tagihan_id_/.test(e.target.id)) return;
    const idx = e.target.id.split('_').pop(), t = tag.find(x => String(x.id) === e.target.value);
    if (!t) return;
    const p = opsiList2('pemasok').find(x => x.nama === t.pemasok);
    if (p) $('#f_pemasok_id_' + idx, host).value = p.id;
    if (!$('#f_nominal_' + idx, host).value) $('#f_nominal_' + idx, host).value = String(t.sisa).replace('.', ',');
    host.dispatchEvent(new Event('input', { bubbles: true }));
  });
  return kb;
}

function crud(el, o) {
  const pk = o.pk || 'id', host = document.createElement('div');
  el.appendChild(host);
  let rows = [];
  const tampilNilai = (c, v) => {
    if (v === null || v === undefined || v === '') return '';
    if (c.t === 'check') return v ? 'Ya' : 'Tidak';
    if (c.t === 'sel') { const l = opsiList(c.o).find(x => String(x[0]) === String(v)); return l ? l[1] : v; }
    return v;
  };
  async function muat() {
    host.innerHTML = kerangka;
    try { rows = await db(sb.from(o.tabel).select('*').order(o.urut || pk, { ascending: !o.desc }).limit(2000)); gambar(); }
    catch (e) { host.innerHTML = pesanGalat(e); }
  }
  function gambar() {
    const kol = o.kolom.filter(c => !c.sembunyi), model = {
      kolom: kol.map(c => ({ k: c.k, l: c.l, t: c.t === 'num' ? 'n' : c.t === 'date' ? 'd' : 't' })),
      baris: rows.map((r, i) => { const x = { __i: i }; kol.forEach(c => { x[c.k] = c.fmt ? c.fmt(r) : (c.t === 'num' || c.t === 'date' ? r[c.k] : tampilNilai(c, r[c.k])); }); return x; })
    };
    host.innerHTML = card(o.judul, (o.info ? '<p class="mut kecil">' + esc(o.info) + '</p>' : '') + (o.tambah !== false ? '<div class="aksi"><button class="btn" id="crTambah">+ Tambah</button></div>' : '') +
      tabelHtml(model, { aksi: r => '<button class="btn btn-kecil btn-alt" data-u="' + r.__i + '">Ubah</button>' + (o.hapus !== false ? ' <button class="btn btn-kecil btn-bahaya" data-h="' + r.__i + '">Hapus</button>' : '') }));
    const t = $('#crTambah', host);
    if (t) t.onclick = () => formModal(null);
    $$('[data-u]', host).forEach(b => b.onclick = () => formModal(rows[Number(b.dataset.u)]));
    $$('[data-h]', host).forEach(b => b.onclick = async () => {
      const r = rows[Number(b.dataset.h)];
      if (!(await konfirmasi('Hapus data ini? Data yang sudah dipakai transaksi tidak bisa dihapus (nonaktifkan saja).', { bahaya: true, ya: 'Hapus' }))) return;
      try { await db(sb.from(o.tabel).delete().eq(pk, r[pk])); toast('Dihapus.', true); await segarkan(); } catch (e) { toast(e.message, false); }
    });
  }
  async function segarkan() { try { await muatOpsi(); } catch (e) { /* offline */ } await muat(); }
  function formModal(row) {
    const baru = !row, nilai = baru ? {} : (o.ke ? o.ke(row) : row);
    const fields = o.kolom.filter(c => !c.tabelSaja).map(c => Object.assign({}, c, { def: baru ? c.def : nilai[c.k], w: c.w }));
    const m = modal('<h3 class="h3">' + (baru ? 'Tambah' : 'Ubah') + ' ' + esc(o.judul) + '</h3><div class="grid-form">' + fields.map(fieldHtml).join('') + '</div>' + (o.modalExtra ? o.modalExtra : '') + '<div id="crPesan"></div><div class="rata-kanan"><button class="btn btn-alt" data-tutup>Batal</button> <button class="btn" id="crSimpan">Simpan</button></div>', { lebar: 'lebar' });
    terapkanTampil(fields, m);
    $$('input,select,textarea', m).forEach(e => { e.addEventListener('input', () => terapkanTampil(fields, m)); e.addEventListener('change', () => terapkanTampil(fields, m)); });
    if (!baru) fields.forEach(c => { if (c.kunci) { const e = $('#f_' + c.k, m); if (e) e.disabled = true; } });
    if (o.pasangModal) o.pasangModal(m);
    $('#crSimpan', m).onclick = async () => {
      const v = bacaFields(fields, m), v0 = Object.assign({}, v);
      fields.forEach(f => { if (f.show && !f.show(v0)) v[f.k] = null; });
      const kosong = fields.filter(f => f.req && (!f.show || f.show(v0)) && (v[f.k] === null || v[f.k] === '' || v[f.k] === undefined));
      if (kosong.length) { $('#crPesan', m).innerHTML = '<div class="msg msg-er">Isian wajib: ' + esc(kosong.map(f => f.l).join(', ')) + '.</div>'; return; }
      let payload = o.dari ? o.dari(v) : v;
      if (baru) Object.keys(payload).forEach(k => { if (payload[k] === null || payload[k] === undefined) delete payload[k]; });
      else fields.forEach(f => { if (f.kunci) delete payload[f.k]; });
      try {
        if (baru) await db(sb.from(o.tabel).insert(payload));
        else await db(sb.from(o.tabel).update(payload).eq(pk, row[pk]));
        m.remove(); toast('Tersimpan.', true); await segarkan();
      } catch (e) { $('#crPesan', m).innerHTML = pesanGalat(e); }
    };
  }

    ['Pelanggan', () => hit('pelanggan'), 'setting/master', 'Master Data > Pelanggan (termin dan dasar tonase).'],
    ['Pemasok', () => hit('pemasok'), 'setting/master', 'Master Data > Pemasok.'],
    ['Tarif rute', () => hit('tarif_rute'), 'setting/master', 'Master Data > Tarif Rute (jarak, tarif tagihan, premi driver, tanggal berlaku).'],
    ['Barang gudang', () => hit('barang'), 'setting/master', 'Master Data > Barang (atau tambah saat pembelian pertama).'],
    ['Interval perawatan', () => hit('interval_perawatan'), 'setting/perawatan', 'Isi interval HM tiap komponen sesuai buku manual unit.'],
    ['Aturan absensi dan lembur (potongan/tarif)', () => hit('aturan_absensi', q => q.neq('potongan_telat_jenis', 'tidak')), 'setting/aturanabsensi', 'Jam shift sudah ada. Isi potongan telat/alpa dan tarif lembur bila dipakai.'],
    ['Pengguna aktif ditautkan ke karyawan', () => hit('profil_pengguna', q => q.not('karyawan_id', 'is', null)), 'setting/pengguna', 'Tautkan akun ke karyawan agar bisa absen dan melihat laporan pribadinya.'],
    ['Dokumen unit dan karyawan (STNK, KIR, SIM)', () => hit('dokumen'), 'setting/master', 'Master Data > Dokumen, agar peringatan kadaluarsa aktif.'],
    ['Saldo awal kas/bank', () => hit('buku_kas', q => q.eq('sub_kategori', 'Saldo Awal')), 'inputan/kas', 'Buku Kas > Pemasukan, sub kategori Saldo Awal.'],
    ['Aset tetap', () => hit('aset'), 'setting/master', 'Master Data > Aset dan Penyusutan.'],
    ['Nama perusahaan untuk kop', async () => (S.kop.nama_perusahaan ? 1 : 0), 'setting/perusahaan', 'Isi nama dan alamat perusahaan.']
  ];
  const hasil = await Promise.all(cek.map(async c => { try { return await c[1](); } catch (e) { return -1; } }));
  el.innerHTML = card('Panduan Data Awal (mulai dari nol)', '<p class="mut">Urutan yang disarankan sebelum operasional. Centang hijau berarti data sudah ada.</p><div class="cek-daftar">' +
    cek.map((c, i) => '<a class="cek-item ' + (hasil[i] > 0 ? 'ok' : '') + '" href="#/' + c[2] + '"><span class="cek-ikon">' + (hasil[i] > 0 ? '✔' : '○') + '</span><span><b>' + esc(c[0]) + '</b><br><small class="mut">' + esc(c[3]) + '</small></span></a>').join('') + '</div>');
};
HALAMAN['setting/audit'] = async el => {
  const isi = document.createElement('div');
  el.innerHTML = '<div class="filter"><label class="lbl-kecil">Tabel<input id="auT" class="inp" placeholder="mis. produksi (kosong = semua)"></label><button class="btn btn-alt" id="auCari">Tampilkan</button></div>';
  el.appendChild(isi);
  const muat = async () => {
    isi.innerHTML = kerangka;
    try {
      let q = sb.from('log_audit').select('*').order('id', { ascending: false }).limit(200);
      const t = $('#auT', el).value.trim(); if (t) q = q.eq('tabel', t);
      const l = await db(q);
      isi.innerHTML = card('Log audit (200 terbaru)', l.length ? '<div class="tabel-wrap"><table class="tbl"><tr><th>Waktu</th><th>Tabel</th><th>Aksi</th><th>ID</th><th>Perubahan</th></tr>' + l.map(x => '<tr><td>' + new Date(x.waktu).toLocaleString('id-ID') + '</td><td>' + esc(x.tabel) + '</td><td>' + esc(x.aksi) + '</td><td>' + esc(x.baris_id) + '</td><td class="kecil">' + esc(JSON.stringify(x.baru || x.lama).slice(0, 160)) + '</td></tr>').join('') + '</table></div>' : '<p class="mut">Tidak ada catatan.</p>');
    } catch (e) { isi.innerHTML = pesanGalat(e); }
  };
  $('#auCari', el).onclick = muat; await muat();
};
